services:
  playground:
    image: salaheldin18/solang-playground-amd64:latest
    container_name: playground
    restart: always
    volumes:
      - /tmp:/tmp
    ports:
      - "9000:9000"
      - "3000:3000" # Expose Next.js port
    environment:
      - DOCKER_ENV=true
    runtime: sysbox-runc
  database:
    image: bitnami/postgresql:latest
    container_name: solang-postgres
    restart: always
    env_file: .env # All services share this file
    volumes:
      - postgresql:/bitnami/postgresql
    tmpfs:
      - /var/lib/pg_stat_tmp
    networks:
      - app-network
    environment:
      - POSTGRESQL_USERNAME=${POSTGRES_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASS}
      - POSTGRESQL_DATABASE=${POSTGRES_DATABASE}
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRES_ADMIN}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgresql:

networks:
  app-network:
    driver: bridge
